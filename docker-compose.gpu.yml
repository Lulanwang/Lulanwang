# Overlay for GPU-accelerated MONAI inference.
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Requires the host to have nvidia-container-toolkit installed.

services:
  backend:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
